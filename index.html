<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AARAMBH | सही जानकारी, सही दिशा, बेहतर भविष्य</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #1F2A24;
      --paper: #F6F2E9;
      --teal-900: #123832;
      --teal-700: #1B4B43;
      --teal-500: #2C6E62;
      --gold: #E8A33D;
      --gold-soft: #FBEBCF;
      --line: #E4DDC9;
      --white: #FFFFFF;
      --danger: #C0503A;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Manrope', 'Noto Sans Devanagari', system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #ffffff 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, #e9dfc6 0%, transparent 40%),
        var(--paper);
      color: var(--ink);
      min-height: 100vh;
      position: relative;
    }

    .widget-anchor {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      z-index: 999;
    }

    /* ---- Floating launcher button ---- */
    .launcher {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      position: relative;
      background: linear-gradient(145deg, var(--teal-700), var(--teal-900));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px -6px rgba(18, 56, 50, 0.55), 0 0 0 4px #fff, 0 0 0 6px var(--gold);
      transition: transform .2s ease;
    }

    .launcher:hover {
      transform: scale(1.06);
    }

    .launcher-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
    }

    .launcher-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      animation: ringPulse 2.4s ease-out infinite;
    }

    @keyframes ringPulse {
      0% {
        transform: scale(0.9);
        opacity: .9;
      }

      70% {
        transform: scale(1.35);
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    .launcher-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--teal-900);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      animation: badgeBounce 1.8s ease-in-out infinite;
    }

    @keyframes badgeBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    .launcher-tip {
      max-width: 200px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      border-bottom-right-radius: 4px;
      padding: 10px 13px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
      box-shadow: 0 10px 24px -8px rgba(18, 56, 50, 0.25);
      animation: tipFloat 3s ease-in-out infinite, tipShow .3s ease 1.2s both;
    }

    @keyframes tipShow {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes tipFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .widget-anchor.open .launcher,
    .widget-anchor.open .launcher-tip,
    .widget-anchor.open .launcher-ring,
    .widget-anchor.open .launcher-badge {
      display: none;
    }

    .phone {
      width: 400px;
      max-width: calc(100vw - 24px);
      height: 700px;
      max-height: 80vh;
      background: var(--white);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px -20px rgba(18, 56, 50, 0.4), 0 0 0 1px var(--line);
      position: relative;
      animation: panelIn .28s cubic-bezier(.2, .9, .3, 1.2);
    }

    .phone.hidden {
      display: none;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      background: linear-gradient(135deg, var(--teal-900), var(--teal-700));
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .mark-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #fff;
      padding: 4px;
      object-fit: contain;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
    }

    .header .brand {
      flex: 1;
      min-width: 0;
    }

    .header .brand-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header .status {
      font-size: 12px;
      color: #CFE3DE;
      margin-top: 1px;
    }

    .header .status::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5BD68A;
      margin-right: 5px;
    }

    .closeBtn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: .15s ease;
    }

    .closeBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .hero-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, #fff, #FCFAF3);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px;
      margin: 0 auto 4px;
      max-width: 92%;
      box-shadow: 0 8px 20px -10px rgba(18, 56, 50, 0.15);
    }

    .hero-banner img {
      width: 110px;
      height: auto;
      margin-bottom: 2px;
    }

    .hero-banner .tagline {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teal-700);
      letter-spacing: .3px;
      background: var(--gold-soft);
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    .hero-strip {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-strip span {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--teal-700);
      background: #EAF5F0;
      padding: 4px 9px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .stepper {
      display: flex;
      align-items: center;
      padding: 14px 14px 10px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .stepper.hidden {
      display: none;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      position: relative;
    }

    .step .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #E9E4D4;
      color: #9C9482;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      border: 2px solid #E9E4D4;
      transition: all .25s ease;
      z-index: 1;
    }

    .step .label {
      font-size: 9.5px;
      color: #9C9482;
      font-weight: 600;
      letter-spacing: .2px;
      text-align: center;
    }

    .step::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: #E9E4D4;
      z-index: 0;
    }

    .step:last-child::after {
      display: none;
    }

    .step.done .dot {
      background: var(--teal-500);
      border-color: var(--teal-500);
      color: #fff;
    }

    .step.done::after {
      background: var(--teal-500);
    }

    .step.done .label {
      color: var(--teal-700);
    }

    .step.active .dot {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--teal-900);
    }

    .step.active .label {
      color: var(--teal-900);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 10px;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 39px, #00000004 40px),
        var(--paper);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #D8CFB4;
      border-radius: 10px;
    }

    .row {
      display: flex;
    }

    .row.bot {
      justify-content: flex-start;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.6;
      box-shadow: 0 1px 2px rgba(18, 56, 50, 0.06);
      animation: pop .22s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bubble.bot {
      background: #fff;
      border: 1px solid var(--line);
      border-top-left-radius: 4px;
    }

    .bubble.user {
      background: var(--gold-soft);
      border: 1px solid #F1DCA8;
      border-top-right-radius: 4px;
      color: var(--teal-900);
      font-weight: 600;
    }

    .bubble b {
      color: var(--teal-900);
    }

    .bubble .time {
      display: block;
      font-size: 10px;
      color: #A69B7E;
      margin-top: 4px;
      text-align: right;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #B9AF90;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    .quick-replies {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .quick-replies::-webkit-scrollbar {
      width: 5px;
    }

    .quick-replies::-webkit-scrollbar-thumb {
      background: #D8CFB4;
      border-radius: 10px;
    }

    .qr-btn {
      background: #fff;
      border: 1px solid var(--teal-500);
      color: var(--teal-700);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: .15s ease;
    }

    .qr-btn .sub {
      display: block;
      font-weight: 500;
      font-size: 11px;
      color: #8A8265;
      margin-top: 2px;
    }

    .qr-btn:hover {
      background: var(--teal-700);
      color: #fff;
    }

    .qr-btn:hover .sub {
      color: #CFE3DE;
    }

    .qr-btn:disabled {
      opacity: .45;
      cursor: default;
      background: #fff;
      color: var(--teal-700);
    }

    .qr-btn:disabled .sub {
      color: #8A8265;
    }

    .qr-btn.primary {
      background: var(--teal-700);
      color: #fff;
      border-color: var(--teal-700);
    }

    .qr-btn.primary:hover {
      background: var(--teal-900);
    }

    .summary-card,
    .pay-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card h4,
    .pay-card h4 {
      margin: 0 0 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      color: var(--teal-900);
    }

    .summary-card .row-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px dashed var(--line);
      padding: 4px 0;
    }

    .summary-card .row-item span:first-child {
      color: #83795F;
      flex-shrink: 0;
    }

    .summary-card .row-item span:last-child {
      font-weight: 700;
      color: var(--ink);
      text-align: right;
    }

    .pay-card .fee {
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      color: var(--teal-900);
      font-weight: 700;
    }

    .pay-card .tag {
      display: inline-block;
      background: var(--gold-soft);
      color: #8A5E12;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #EAF5F0;
      color: var(--teal-700);
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    .pay-tabs {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      background: var(--paper);
      border-radius: 12px;
      padding: 4px;
    }

    .pay-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: #83795F;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 6px;
      border-radius: 9px;
      cursor: pointer;
      transition: .15s ease;
    }

    .pay-tab.active {
      background: #fff;
      color: var(--teal-900);
      box-shadow: 0 2px 6px rgba(18, 56, 50, 0.12);
    }

    .pay-tab-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 14px 4px 4px;
      gap: 6px;
    }

    .pay-tab-panel.hidden {
      display: none;
    }

    .upi-qr {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 6px;
      background: #fff;
    }

    .pay-instruction {
      font-size: 11.5px;
      color: #5F7168;
      line-height: 1.5;
      max-width: 230px;
    }

    .upi-id-row {
      font-size: 12px;
      color: var(--ink);
      background: var(--paper);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .upi-app-link {
      display: block;
      text-align: center;
      text-decoration: none;
      width: 100%;
    }

    .inputbar {
      flex-shrink: 0;
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .inputbar input {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      color: var(--ink);
    }

    .inputbar input:focus {
      border-color: var(--teal-500);
    }

    .inputbar button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--teal-700);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .inputbar button:disabled {
      background: #C9C2AC;
      cursor: not-allowed;
    }

    .inputbar.hidden {
      display: none;
    }

    .err {
      color: var(--danger);
      font-size: 11.5px;
      padding: 0 4px;
      min-height: 14px;
    }

    .file-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      max-width: 86%;
    }

    .file-row input[type=file] {
      font-size: 12px;
    }

    .file-list {
      font-size: 11.5px;
      color: #5F7168;
    }

    .file-row .qr-btn {
      margin-top: 2px;
    }

    .footer-credit {
      text-align: center;
      font-size: 10px;
      color: #B7AE94;
      padding: 6px 0 10px;
      flex-shrink: 0;
      background: #fff;
    }

    @media (max-width:420px) {
      .phone {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }

      body {
        padding: 0;
      }
    }
  </style>
</head>

function translateField(field, lang){
  if (lang === 'en') return field;
  const t = FIELD_TRANSLATIONS[field];
  return t && t[lang] ? t[lang] : field;
}

function nowTime(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2,'0')} ${ap}`;
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'bot' ? 'bot' : 'user');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who === 'bot' ? 'bot' : 'user');
  b.innerHTML = text + `<span class="time">${nowTime()}</span>`;
  row.appendChild(b);
  chat.appendChild(row);
  scrollDown();
  return row;
}

function addQuickReplies(options, onPick){

  options.forEach(opt => {

    btn.className = 'qr-btn' + (opt.primary ? ' primary' : '');
    btn.innerHTML = opt.label + (opt.sub ? `<span class="sub">${opt.sub}</span>` : '');
    btn.onclick = () => {

      addBubble(opt.label.replace(/<[^>]*>/g,''), 'user');
      onPick(opt.value !== undefined ? opt.value : opt.label);
    };

  chat.appendChild(row);
  scrollDown();
  return wrap;
}

function botTyping(delay=550){
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(row);
    scrollDown();
    setTimeout(() => {
      const el = document.getElementById('typingRow');
      if (el) el.remove();
      resolve();
    }, delay);
  });
}

function setStepper(activeKey, doneKeys){
  document.querySelectorAll('.step').forEach(el => {
    const key = el.dataset.step;
    el.classList.remove('active','done');
    if (doneKeys.includes(key)) el.classList.add('done');
    else if (key === activeKey) el.classList.add('active');
  });
}

function showTextInput(placeholder, validator, onSubmit){
  errBox.textContent = '';
  inputbar.classList.remove('hidden');
  textInput.value = '';
  textInput.placeholder = placeholder;
  textInput.disabled = false;
  sendBtn.disabled = false;
  textInput.focus();

  const handler = () => {
    const val = textInput.value.trim();
    const error = validator(val);
    if (error){ errBox.textContent = error; return; }
    errBox.textContent = '';
    textInput.disabled = true; sendBtn.disabled = true;
    inputbar.classList.add('hidden');
    addBubble(escapeHtml(val), 'user');
    sendBtn.removeEventListener('click', handler);
    textInput.removeEventListener('keydown', keyHandler);
    onSubmit(val);
  };
  const keyHandler = (e) => { if (e.key === 'Enter') handler(); };
  sendBtn.addEventListener('click', handler);
  textInput.addEventListener('keydown', keyHandler);
}
function hideTextInput(){
  inputbar.classList.add('hidden');
  errBox.textContent = '';
}

function fieldIsDuplicate(fieldName){
  const f = fieldName.toLowerCase();
  return f.startsWith('full name') || f.includes('mobile');
}
function isYearsField(fieldName){
  return /number of year/i.test(fieldName);
}
function getActiveCategories(){
  const seen = [];
  SERVICES_DATA.forEach(s => {
    if (s.active && !seen.includes(s.category)) seen.push(s.category);
  });
  return seen;
}
function getServicesInCategory(cat){
  return SERVICES_DATA.filter(s => s.active && s.category === cat);
}
function genAppId(){
  const d = new Date();
  const pad = n => n.toString().padStart(2,'0');
  return 'AAR' + d.getFullYear().toString().slice(-2) + pad(d.getMonth()+1) + pad(d.getDate())
    + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

/* ====================== DIRECT SERVICE MATCHING ====================== */
const FILLER_WORDS = new Set(['mujhe','muje','mujhy','chahiye','chaiye','please','i','want','need',
  'karna','karwana','banwana','banana','hai','ka','ke','ki','the','a','an','for','apply',
  'application','get','my','me','to','karo','kardo','kar','do','is','it']);

function normalizeText(s){
  return s.toLowerCase()
    .replace(/aadhar/g,'aadhaar')
    .replace(/licence/g,'license')
    .replace(/[^a-z0-9\u0900-\u097F\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function extractKeywords(s){
  return normalizeText(s).split(' ').filter(w => w.length>1 && !FILLER_WORDS.has(w));
}
function matchService(query){
  const qWords = extractKeywords(query);
  if (qWords.length === 0) return null;
  const active = SERVICES_DATA.filter(s => s.active);
  let scored = active.map(s => {
    const sWords = extractKeywords(s.service + ' ' + s.category);
    let score = 0;
    qWords.forEach(qw => {
      if (sWords.some(sw => sw === qw || sw.includes(qw) || qw.includes(sw))) score++;
    });
    const ratio = sWords.length ? score / sWords.length : 0;
    return { s, score, ratio };
  }).filter(x => x.score > 0);

  if (scored.length === 0) return null;
  const maxScore = Math.max(...scored.map(x => x.score));
  const top = scored.filter(x => x.score === maxScore);

  const qualifies = maxScore >= 2 || (maxScore === 1 && qWords.length <= 2);
  if (!qualifies) return null;

  if (top.length === 1) return top[0].s;
  // tie-break by ratio (more specific / shorter service name wins)
  top.sort((a,b) => b.ratio - a.ratio);
  if (top[0].ratio > top[1].ratio) return top[0].s;
  return null; // genuinely ambiguous
}

async function askCategoryOrService(){
  await botSay(T('askCategoryOrService'));
  const cats = getActiveCategories();
  let resolved = false;

  const wrap = addQuickRepliesRaw(cats.map(c => ({label:c})), (cat) => {
    if (resolved) return;
    resolved = true;
    hideTextInput();
    lead.category = cat;
    askService();
  });

  showTextInput(T('directInputPlaceholder'), () => null, (val) => {
    if (resolved) return;
    resolved = true;
    disableWrap(wrap);
    const matched = matchService(val);
    if (matched){
      handleDirectMatch(matched);
    } else {
      botSay(T('noDirectMatch')).then(() => {
        resolved = false;
        askCategoryOrService();
      });
    }
  });
}

async function handleDirectMatch(svc){
  await botSay(T('directMatchAck', escapeHtml(svc.service)));
  onServiceChosen(svc);
}

async function askService(){
  await botSay(T('askService', escapeHtml(lead.category)));
  const services = getServicesInCategory(lead.category);
  addQuickReplies(services.map(s => ({
    label: s.service,
    sub: T('priceLabel', s.price) + ' · ' + T('turnaroundLabel', s.turnaround),
    value: s.service
  })), (serviceName) => {
    const svc = services.find(s => s.service === serviceName);
    onServiceChosen(svc);
  });
}

function onServiceChosen(svc){
  lead.category = svc.category;
  lead.service = svc.service;
  lead.govtCharge = svc.govtCharge || 0;
  lead.aarambhCharge = svc.aarambhCharge || 0;
  lead.price = svc.price;
  lead.turnaround = svc.turnaround || T('feeTBD');
  lead._fieldsToAsk = svc.fields.filter(f => !fieldIsDuplicate(f));
  lead._docsList = (svc.docs || []).slice();
  lead._noteType = svc.noteType;
  lead.years = null;
  lead.extraFields = {};
  lead.docsStatus = [];
  proceedAfterServiceChosen();
}

async function proceedAfterServiceChosen(){
  if (lead._noteType === 'info'){
    await botSay(T('noteInfoText'));
  } else if (lead._noteType === 'per_year'){
    await botSay(T('notePerYearText'));
  }
  askNextField(0);
}

async function askNextField(idx){
  const fields = lead._fieldsToAsk || [];
  if (idx >= fields.length){
    showSummary();
    return;
  }
  const field = fields[idx];
  const label = translateField(field, LANG);
  const isYears = isYearsField(field);
  await botSay(`${escapeHtml(label)}?`);
  showTextInput(`${label}…`, v => {
    if (v.length < 1) return T('fieldError');
    if (isYears && (!/^\d+$/.test(v) || parseInt(v,10) < 1 || parseInt(v,10) > 10)) return T('yearsError');
    return null;
  }, v => {
    lead.extraFields[label] = v;
    if (isYears && lead._noteType === 'per_year'){
      const years = parseInt(v, 10);
      lead.years = years;
      lead.price = (lead.govtCharge * years) + lead.aarambhCharge;
    }
    askNextField(idx + 1);
  });
}

// Fires a save/update to the sheet. Uses a readable (non-no-cors) request so failures can be
// diagnosed, but never blocks or breaks the chat if it fails.
async function submitToSheet(payload){
  if (!SHEET_ENDPOINT || SHEET_ENDPOINT.includes("PASTE_YOUR")) return false;
  try{
    const res = await fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    return res.ok;
  }catch(err){
    return false;
  }
}

  await botSay(T('summaryIntro'));
  const row = document.createElement('div');
  row.className = 'row bot';
  let extraRows = Object.entries(lead.extraFields).map(([k,v]) =>
    `<div class="row-item"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`
  ).join('');
  let feeRows = '';
  if (lead.years){
    feeRows = `
      <div class="row-item"><span>${T('labelGovtCharges', lead.years)}</span><span>₹${lead.govtCharge * lead.years}</span></div>
      <div class="row-item"><span>${T('labelAarambhCharges')}</span><span>₹${lead.aarambhCharge}</span></div>`;
  }
  row.innerHTML = `
    <div class="summary-card" style="max-width:88%">
      <h4>${T('summaryTitle')}</h4>
      <div class="row-item"><span>${T('labelName')}</span><span>${escapeHtml(lead.name)}</span></div>
      <div class="row-item"><span>${T('labelPhone')}</span><span>${escapeHtml(lead.phone)}</span></div>
      <div class="row-item"><span>${T('labelService')}</span><span>${escapeHtml(lead.service)}</span></div>
      ${extraRows}
      ${feeRows}
      <div class="row-item"><span>${T('labelFee')}</span><span>${lead.price ? '₹'+lead.price : T('feeTBD')}</span></div>
      <div class="row-item"><span>${T('labelTurnaround')}</span><span>${escapeHtml(lead.turnaround)}</span></div>
    </div>`;
  chat.appendChild(row);
  scrollDown();
  addQuickReplies([
    {label:T('confirmBtn'), primary:true, value:"confirm"},
    {label:T('startOverBtn')}
  ], (choice) => {
    if (choice === 'confirm'){
      lead.appId = genAppId();
      const fieldsProvided = Object.entries(lead.extraFields).map(([k,v]) => `${k}: ${v}`).join('; ');
      submitToSheet({
        leadId: lead.appId,
        name: lead.name,
        phone: lead.phone,
        category: lead.category,
        service: lead.service,
        price: lead.price,
        fieldsProvided: fieldsProvided,
        fieldsObject: lead.extraFields,
        language: LANG
      });
      goToPayment();
    } else {
      location.reload();
    }
  });
}

async function goToPayment(){
  setStepper('payment', ['info','confirm']);
  await botSay(T('paymentIntro'));

  const hasPrice = !!lead.price;
  const upiConfigured = UPI_ID && !UPI_ID.includes('PASTE_YOUR');
  const row = document.createElement('div');
  row.className = 'row bot';

  if (hasPrice && upiConfigured){
    const upiLink = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(UPI_PAYEE_NAME)}&am=${lead.price}&cu=INR&tn=${encodeURIComponent('Aarambh - ' + lead.service)}`;
    const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
    row.innerHTML = `
      <div class="pay-card" style="max-width:90%">
        <h4>${T('payCardTitle')}</h4>
        <div class="fee">₹${lead.price}</div>
        <div>${T('payForService', escapeHtml(lead.service))}</div>
        <span class="trust-badge">${T('payTrustBadge')}</span>
        <div class="pay-tabs">
          <button class="pay-tab active" data-tab="qr" type="button">${T('payScanTab')}</button>
          <button class="pay-tab" data-tab="app" type="button">${T('payAppTab')}</button>
        </div>
        <div class="pay-tab-panel" id="payPanelQr">
          <img src="${qrImgUrl}" alt="UPI QR" class="upi-qr">
          <div class="pay-instruction">${T('payScanInstruction')}</div>
          <div class="upi-id-row">${T('payUpiIdLabel')}: <b>${UPI_ID}</b></div>
        </div>
        <div class="pay-tab-panel hidden" id="payPanelApp">
          <a href="${upiLink}" class="qr-btn primary upi-app-link" target="_blank" rel="noopener">${T('payAppBtn', '₹'+lead.price)}</a>
          <div class="pay-instruction">${T('payAppInstruction')}</div>
        </div>
      </div>`;
  } else {
    row.innerHTML = `
      <div class="pay-card" style="max-width:88%">
        <h4>${T('payCardTitle')}</h4>
        <div class="fee">${hasPrice ? '₹'+lead.price : T('feeTBD')}</div>
        <div>${T('payForService', escapeHtml(lead.service))}</div>
        <span class="trust-badge">${T('payTrustBadge')}</span>
      </div>`;
  }
  chat.appendChild(row);
  scrollDown();

  if (hasPrice && upiConfigured){
    const tabs = row.querySelectorAll('.pay-tab');
    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        row.querySelector('#payPanelQr').classList.toggle('hidden', tab.dataset.tab !== 'qr');
        row.querySelector('#payPanelApp').classList.toggle('hidden', tab.dataset.tab !== 'app');
      };
    });
  }

  addQuickReplies([
    {label:T('paidBtn'), primary:true, value:'paid'}
  ], () => {
    lead.txnId = genTxnId();
    askPaymentProof();
  });
}

function genTxnId(){
  return 'ARB' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2,6).toUpperCase();
}

async function askPaymentProof(){
  await botSay(T('paymentProofPrompt'));
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'file-row';
  wrap.style.maxWidth = '88%';
  wrap.innerHTML = `
    <input type="file" id="proofFileInput" accept="image/*,application/pdf">
    <div class="file-list" id="proofFileList"></div>
    <button class="qr-btn primary" id="proofUploadBtn">${T('paymentProofUpload')}</button>
  `;
  row.appendChild(wrap);
  chat.appendChild(row);
  scrollDown();

  const fileInput = wrap.querySelector('#proofFileInput');
  const fileList = wrap.querySelector('#proofFileList');
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    fileList.textContent = f ? `${f.name} (${(f.size/1024/1024).toFixed(1)}MB)` : '';
  });

  wrap.querySelector('#proofUploadBtn').onclick = async () => {
    const file = fileInput.files[0];
    if (!file){
      fileList.innerHTML = `<span style="color:#C0503A">${T('paymentProofRequired')}</span>`;
      return;
    }
    if (file.size > MAX_FILE_MB * 1024 * 1024){
      fileList.innerHTML = `<span style="color:#C0503A">${T('docTooBig', MAX_FILE_MB)}</span>`;
      return;
    }
    wrap.querySelectorAll('button, input').forEach(el => el.disabled = true);
    addBubble(T('docFileAttached'), 'user');
    await botSay(T('uploading'), 400);
    try{
      lead.paymentProof = await fileToBase64(file);
    }catch(err){
      lead.paymentProof = null;
    }
    await botSay(T('verifyingPayment'), 700);
    lead.paymentVerified = await verifyPaymentAmount();
    lead.paymentStatus = lead.paymentVerified
      ? "Paid — Amount Auto-Verified ✅"
      : "Paid — Screenshot Uploaded (Manual Check Needed)";
    submitToSheet({
      leadId: lead.appId,
      phone: lead.phone,
      paymentStatus: lead.paymentStatus,
      txnId: lead.txnId,
      documents: lead.paymentProof ? [{ name: 'Payment Screenshot', status: 'uploaded', file: lead.paymentProof }] : []
    });
    showPaymentConfirmation();
  };
}

// Ask the backend to OCR the screenshot and check whether the expected amount appears in it.
// Best-effort: if the check can't be completed (no network / not yet configured), we don't
// block the customer — the team can still verify manually from the screenshot in the sheet.
async function verifyPaymentAmount(){
  if (!lead.paymentProof || !SHEET_ENDPOINT || SHEET_ENDPOINT.includes("PASTE_YOUR")) return false;
  try{
    const res = await fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'verifyPayment',
        amount: lead.price,
        file: lead.paymentProof
      })
    });
    const json = await res.json();
    return !!json.verified;
  }catch(err){
    return false;
  }
}

async function showPaymentConfirmation(){
  setStepper('docs', ['info','confirm','payment']);
  await botSay(T('paymentReceivedMsg', escapeHtml(lead.name), escapeHtml(lead.service), lead.price || '', lead.txnId), 800);
  askDocsSequential(0);
}

/* ---- One document at a time ---- */
async function askDocsSequential(idx){
  const docs = lead._docsList || [];
  if (docs.length === 0){
    await botSay(T('noDocsNeededMsg'));
    return finalizeSubmission();
  }
  if (idx >= docs.length){
    return finalizeSubmission();
  }
  const docName = docs[idx];
  await botSay(T('docUploadPrompt', escapeHtml(docName)));
  addQuickReplies([
    {label:T('docChoiceNow'), value:"now"},
    {label:T('docChoiceLater'), value:"later"}
  ], (choice) => {
    if (choice === 'now'){
      showSingleFileUpload(docName, (fileObj) => {
        lead.docsStatus.push({ name: docName, status: fileObj ? 'uploaded' : 'later', file: fileObj });
        askDocsSequential(idx + 1);
      });
    } else {
      lead.docsStatus.push({ name: docName, status: 'later', file: null });
      askDocsSequential(idx + 1);
    }
  });
}

function showSingleFileUpload(docName, onDone){
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'file-row';
  wrap.style.maxWidth = '88%';
  wrap.innerHTML = `
    <div>${T('docSingleFileLabel', MAX_FILE_MB)}</div>
    <input type="file" id="singleFileInput" accept="image/*,application/pdf">
    <div class="file-list" id="singleFileList"></div>
    <button class="qr-btn primary" id="singleUploadBtn">${T('docUploadSubmitBtn')}</button>
  `;
  row.appendChild(wrap);
  chat.appendChild(row);
  scrollDown();

  const fileInput = wrap.querySelector('#singleFileInput');
  const fileList = wrap.querySelector('#singleFileList');
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    fileList.textContent = f ? `${f.name} (${(f.size/1024/1024).toFixed(1)}MB)` : '';
  });

  wrap.querySelector('#singleUploadBtn').onclick = async () => {
    const file = fileInput.files[0];
    if (file && file.size > MAX_FILE_MB * 1024 * 1024){
      fileList.innerHTML = `<span style="color:#C0503A">${T('docTooBig', MAX_FILE_MB)}</span>`;
      return;
    }
    wrap.querySelectorAll('button, input').forEach(el => el.disabled = true);
    if (file){
      addBubble(T('docFileAttached'), 'user');
      await botSay(T('uploading'), 400);
      try{
        const encoded = await fileToBase64(file);
        onDone(encoded);
      }catch(err){
        onDone(null);
      }
    } else {
      addBubble(T('docFileNone'), 'user');
      onDone(null);
    }
  };
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve({ name: file.name, mimeType: file.type || 'application/octet-stream', data: base64 });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function finalizeSubmission(){
  await botTyping(700);
  const documents = lead.docsStatus.map(d => ({
    name: d.name,
    status: d.status,
    file: d.status === 'uploaded' ? d.file : null
  }));
  await submitToSheet({
    leadId: lead.appId,
    phone: lead.phone,
    documents: documents
  });
  addBubble(`${T('finalTitle', escapeHtml(lead.name))}<br>${T('finalBody')}`, 'bot');
  hideTextInput();
  addQuickReplies([
    {label:T('exploreBtn'), primary:true, value:"explore"}
  ], () => {
    resetForNextService();
  });
}

function resetForNextService(){
  lead.category = ""; lead.service = ""; lead.govtCharge = 0; lead.aarambhCharge = 0;
  lead.price = null; lead.turnaround = ""; lead.years = null;
  lead.extraFields = {}; lead.paymentStatus = ""; lead.paymentProof = null; lead.paymentVerified = false;
  lead.docsStatus = []; lead.appId = ""; lead.txnId = "";
  setStepper('info', []);
  askCategoryOrService();
}

/* ====================== LAUNCHER TOGGLE ====================== */
const widgetAnchor = document.querySelector('.widget-anchor');
const launcherBtn = document.getElementById('launcherBtn');
const launcherTip = document.getElementById('launcherTip');
const phonePanel = document.getElementById('phonePanel');
const closeBtn = document.getElementById('closeBtn');
let chatStarted = false;

function openWidget(){
  widgetAnchor.classList.add('open');
  phonePanel.classList.remove('hidden');
  if (!chatStarted){
    chatStarted = true;
    start();
  }
}
function closeWidget(){
  widgetAnchor.classList.remove('open');
  phonePanel.classList.add('hidden');
}
launcherBtn.addEventListener('click', openWidget);
launcherTip.addEventListener('click', openWidget);
closeBtn.addEventListener('click', closeWidget);

setTimeout(() => {
  if (launcherTip) launcherTip.style.opacity = '0.85';
}, 8000);

</script>
