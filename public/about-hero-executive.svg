<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 560 480" width="560" height="480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Aarambh support executive</title>
  <desc id="d">A friendly support executive in a green polo shirt sits at a desk with a laptop, a stack of files and a small plant, ready to help.</desc>
  <defs>
    <linearGradient id="polo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5B43"/>
      <stop offset="1" stop-color="#134230"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C9A2"/>
      <stop offset="1" stop-color="#DDB68B"/>
    </linearGradient>
    <linearGradient id="lap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5DAE1"/>
      <stop offset="1" stop-color="#AEB7C3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8BC66"/>
      <stop offset="1" stop-color="#BE8A3F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a1e" flood-opacity="0.22"/>
    </filter>
    <clipPath id="idClip"><rect x="252" y="428" width="58" height="74" rx="7"/></clipPath>
  </defs>

  <!-- plant (behind laptop, right) -->
  <g transform="translate(-16 0)">
