    <path d="M520 470 C528 436 540 410 552 392" stroke="#2A7B55" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M512 470 C508 440 480 428 470 410" stroke="#2A7B55" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="505" cy="366" rx="17" ry="34" fill="#3E9E6B" transform="rotate(-8 505 366)"/>
    <ellipse cx="552" cy="388" rx="14" ry="30" fill="#2F8A63" transform="rotate(28 552 388)"/>
    <ellipse cx="468" cy="404" rx="14" ry="30" fill="#3E9E6B" transform="rotate(-38 468 404)"/>
    <ellipse cx="528" cy="420" rx="12" ry="26" fill="#52B07E" transform="rotate(14 528 420)"/>
    <path d="M505 336 L505 392" stroke="#2A7B55" stroke-width="2" opacity=".5"/>
  </g>

