  <!-- laptop (back faces viewer) -->
  <g filter="url(#soft)">
    <rect x="352" y="440" width="170" height="104" rx="9" fill="url(#lap)"/>
    <rect x="352" y="440" width="170" height="104" rx="9" fill="none" stroke="#98A1AE" stroke-width="2"/>
