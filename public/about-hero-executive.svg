  <path d="M138 470 C124 494 128 522 152 536" stroke="#B67B53" stroke-width="3" fill="none" opacity=".5"/>
  <path d="M424 470 C436 494 432 520 410 532 C396 540 372 544 352 542 L350 518 C372 518 388 512 396 500 C402 490 398 478 392 468 Z" fill="#C98F66"/>
  <!-- sleeves -->
  <path d="M110 480 C110 440 140 412 180 408 C204 406 208 440 202 470 C199 490 190 504 176 508 L126 508 C114 502 110 492 110 480 Z" fill="#134230"/>
  <path d="M118 470 C122 446 144 424 172 418" stroke="#2C7A5B" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>
  <path d="M450 480 C450 440 420 412 380 408 C356 406 352 440 358 470 C361 490 370 504 384 508 L434 508 C446 502 450 492 450 480 Z" fill="#134230"/>
  <!-- hands clasped -->
  <g filter="url(#soft)">
    <path d="M232 536 C232 516 252 508 282 508 C312 508 334 516 334 536 C334 552 312 558 284 558 C254 558 232 552 232 536 Z" fill="#D29B72"/>
    <path d="M246 546 C262 552 306 552 322 546" stroke="#B67B53" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".6"/>
    <circle cx="256" cy="516" r="9" fill="#D9A47C"/>
    <circle cx="274" cy="511" r="9.5" fill="#D9A47C"/>
    <circle cx="293" cy="511" r="9.5" fill="#D9A47C"/>
    <circle cx="311" cy="516" r="9" fill="#D9A47C"/>
    <path d="M265 520 L265 534 M284 518 L284 534 M302 520 L302 534" stroke="#B67B53" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
    <path d="M318 520 C336 520 344 530 338 540 C332 548 320 544 316 536 Z" fill="#CB9068"/>
    <path d="M232 526 C220 526 214 536 220 544 C226 550 236 546 238 538 Z" fill="#C98F66"/>
