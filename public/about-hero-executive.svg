  <!-- neck -->
  <path d="M254 322 L254 384 C254 398 306 398 306 384 L306 322 Z" fill="#B67B53"/>
  <!-- neck shadow under chin -->
  <path d="M254 340 C268 356 292 356 306 340 L306 322 L254 322 Z" fill="#A66D47" opacity=".55"/>

