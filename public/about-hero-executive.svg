    <path d="M196 572 L370 572 L378 604 L188 604 Z" fill="#FFFFFF" opacity=".92"/>
    <path d="M196 572 L370 572 L378 604 L188 604 Z" fill="none" stroke="#C7D6C2" stroke-width="2"/>
