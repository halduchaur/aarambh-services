<style>
  :root{
    --ink:#1F2A24;
    --paper:#F6F2E9;
    --teal-900:#123832;
    --teal-700:#1B4B43;
    --teal-500:#2C6E62;
    --gold:#E8A33D;
    --gold-soft:#FBEBCF;
    --line:#E4DDC9;
    --white:#FFFFFF;
    --danger:#C0503A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Manrope','Noto Sans Devanagari',system-ui,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #ffffff22, transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }

  .phone{
    width:400px;
    max-width:100%;
    height:780px;
    max-height:92vh;
    background:var(--white);
    border-radius:28px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 60px -20px rgba(18,56,50,0.35), 0 0 0 1px var(--line);
    position:relative;
  }

  .header{
    background:linear-gradient(135deg,var(--teal-900),var(--teal-700));
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .header .mark{
    width:38px;height:38px;border-radius:10px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:700;color:var(--teal-900);
    font-size:16px;flex-shrink:0;
  }
  .header .brand{flex:1;min-width:0;}
  .header .brand-name{
    font-family:'Poppins',sans-serif;
    font-weight:700; font-size:16px; line-height:1.2;
    display:flex; align-items:center; gap:6px;
  }
  .header .status{font-size:12px;color:#CFE3DE;margin-top:1px;}
  .header .status::before{
    content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#5BD68A;margin-right:5px;
  }

  .stepper{
    display:flex; align-items:center;
    padding:14px 14px 10px;
    background:var(--white);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .stepper.hidden{display:none;}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
  .step .dot{
    width:22px;height:22px;border-radius:50%;
    background:#E9E4D4; color:#9C9482;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    border:2px solid #E9E4D4;
    transition:all .25s ease;
    z-index:1;
  }
  .step .label{font-size:9.5px;color:#9C9482;font-weight:600;letter-spacing:.2px;text-align:center;}
  .step::after{
    content:'';position:absolute;top:10px;left:50%;width:100%;height:2px;
    background:#E9E4D4; z-index:0;
  }
  .step:last-child::after{display:none;}
  .step.done .dot{background:var(--teal-500);border-color:var(--teal-500);color:#fff;}
  .step.done::after{background:var(--teal-500);}
  .step.done .label{color:var(--teal-700);}
  .step.active .dot{background:var(--gold);border-color:var(--gold);color:var(--teal-900);}
  .step.active .label{color:var(--teal-900);}

  .chat{
    flex:1;
    overflow-y:auto;
    padding:16px 14px 10px;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, #00000004 40px),
      var(--paper);
    display:flex; flex-direction:column; gap:10px;
  }
  .chat::-webkit-scrollbar{width:6px;}
  .chat::-webkit-scrollbar-thumb{background:#D8CFB4;border-radius:10px;}

  .row{display:flex;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.6;
    box-shadow:0 1px 2px rgba(18,56,50,0.06);
    animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .bubble.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;}
  .bubble.user{background:var(--gold-soft);border:1px solid #F1DCA8;border-top-right-radius:4px;color:var(--teal-900);font-weight:600;}
  .bubble b{color:var(--teal-900);}
  .bubble .time{display:block;font-size:10px;color:#A69B7E;margin-top:4px;text-align:right;}

  .typing{display:flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px;width:fit-content;}
  .typing span{width:6px;height:6px;background:#B9AF90;border-radius:50%;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .quick-replies{display:flex;flex-direction:column;gap:8px;margin-top:2px;max-height:340px;overflow-y:auto;padding-right:2px;}
  .quick-replies::-webkit-scrollbar{width:5px;}
  .quick-replies::-webkit-scrollbar-thumb{background:#D8CFB4;border-radius:10px;}
  .qr-btn{
    background:#fff; border:1px solid var(--teal-500); color:var(--teal-700);
    font-family:inherit; font-weight:700; font-size:13px;
    padding:10px 14px; border-radius:12px; cursor:pointer; text-align:left;
    transition:.15s ease;
  }
  .qr-btn .sub{display:block;font-weight:500;font-size:11px;color:#8A8265;margin-top:2px;}
  .qr-btn:hover{background:var(--teal-700);color:#fff;}
  .qr-btn:hover .sub{color:#CFE3DE;}
  .qr-btn:disabled{opacity:.45;cursor:default;background:#fff;color:var(--teal-700);}
  .qr-btn:disabled .sub{color:#8A8265;}
  .qr-btn.primary{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
  .qr-btn.primary:hover{background:var(--teal-900);}

  .summary-card, .pay-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:13px;line-height:1.7;
  }
  .summary-card h4, .pay-card h4{margin:0 0 8px;font-family:'Poppins',sans-serif;font-size:13.5px;color:var(--teal-900);}
  .summary-card .row-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0;}
  .summary-card .row-item span:first-child{color:#83795F;flex-shrink:0;}
  .summary-card .row-item span:last-child{font-weight:700;color:var(--ink);text-align:right;}

  .pay-card .fee{font-family:'Poppins',sans-serif;font-size:22px;color:var(--teal-900);font-weight:700;}
  .pay-card .tag{
    display:inline-block;background:var(--gold-soft);color:#8A5E12;font-size:10.5px;font-weight:700;
    padding:3px 8px;border-radius:20px;margin-top:6px;
  }

  .inputbar{
    flex-shrink:0;
    padding:10px 12px;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex; gap:8px; align-items:center;
  }
  .inputbar input{
    flex:1; border:1px solid var(--line); background:var(--paper);
    border-radius:22px; padding:11px 16px; font-size:13.5px; font-family:inherit;
    outline:none; color:var(--ink);
  }
  .inputbar input:focus{border-color:var(--teal-500);}
  .inputbar button{
    width:40px;height:40px;border-radius:50%;border:none;
    background:var(--teal-700); color:#fff; display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .inputbar button:disabled{background:#C9C2AC;cursor:not-allowed;}
  .inputbar.hidden{display:none;}
  .err{color:var(--danger);font-size:11.5px;padding:0 4px;min-height:14px;}

  .file-row{
    display:flex; flex-direction:column; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; max-width:86%;
  }
  .file-row input[type=file]{font-size:12px;}
  .file-list{font-size:11.5px;color:#5F7168;}
  .file-row .qr-btn{margin-top:2px;}

  .footer-credit{
    text-align:center;font-size:10px;color:#B7AE94;padding:6px 0 10px;
    flex-shrink:0; background:#fff;
  }

  @media (max-width:420px){
    .phone{height:100vh;max-height:100vh;border-radius:0;}
    body{padding:0;}
  }
</style>
</head>

    exploreBtn:"🔎 इतर सेवा पहा",
    submitError:"⚠️ अर्ज सबमिट करताना अडचण आली. कृपया थोड्या वेळाने पुन्हा प्रयत्न करा.",
    langPrompt:"👋 स्वागत आहे! सुरू ठेवण्यासाठी कृपया तुमची आवडती भाषा निवडा.",
  }
};
let LANG = 'en';
function T(key, ...args){
  const entry = STRINGS[LANG][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}


/* ====================== STATE ====================== */
const lead = {
  name:"", phone:"",
  category:"", service:"", price:null, turnaround:"",
  extraFields:{}, paymentStatus:"", docsChoice:"", files:[]
};

const chat = document.getElementById('chat');
const inputbar = document.getElementById('inputbar');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const errBox = document.getElementById('err');
const stepperEl = document.getElementById('stepper');

function nowTime(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m.toString().padStart(2,'0')} ${ap}`;
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'bot' ? 'bot' : 'user');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who === 'bot' ? 'bot' : 'user');
  b.innerHTML = text + `<span class="time">${nowTime()}</span>`;
  row.appendChild(b);
  chat.appendChild(row);
  scrollDown();
  return row;
}

function addQuickReplies(options, onPick){
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  wrap.style.maxWidth = '86%';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn' + (opt.primary ? ' primary' : '');
    btn.innerHTML = opt.label + (opt.sub ? `<span class="sub">${opt.sub}</span>` : '');
    btn.onclick = () => {
      Array.from(wrap.children).forEach(c => c.disabled = true);
      addBubble(opt.label.replace(/<[^>]*>/g,''), 'user');
      onPick(opt.value !== undefined ? opt.value : opt.label);
    };
    wrap.appendChild(btn);
  });
  row.appendChild(wrap);
  chat.appendChild(row);
  scrollDown();
}

function botTyping(delay=550){
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(row);
    scrollDown();
    setTimeout(() => {
      const el = document.getElementById('typingRow');
      if (el) el.remove();
      resolve();
    }, delay);
  });
}
async function botSay(text, delay=550){
  await botTyping(delay);
  addBubble(text, 'bot');
}

function refreshStepperLabels(){
  document.getElementById('lbl-info').textContent = T('stepInfo');
  document.getElementById('lbl-confirm').textContent = T('stepConfirm');
  document.getElementById('lbl-payment').textContent = T('stepPayment');
  document.getElementById('lbl-docs').textContent = T('stepDocs');
}
function setStepper(activeKey, doneKeys){
  document.querySelectorAll('.step').forEach(el => {
    const key = el.dataset.step;
    el.classList.remove('active','done');
    if (doneKeys.includes(key)) el.classList.add('done');
    else if (key === activeKey) el.classList.add('active');
  });
}

function showTextInput(placeholder, validator, onSubmit){
  errBox.textContent = '';
  inputbar.classList.remove('hidden');
  textInput.value = '';
  textInput.placeholder = placeholder;
  textInput.disabled = false;
  sendBtn.disabled = false;
  textInput.focus();

  const handler = () => {
    const val = textInput.value.trim();
    const error = validator(val);
    if (error){ errBox.textContent = error; return; }
    errBox.textContent = '';
    textInput.disabled = true; sendBtn.disabled = true;
    inputbar.classList.add('hidden');
    addBubble(escapeHtml(val), 'user');
    sendBtn.removeEventListener('click', handler);
    textInput.removeEventListener('keydown', keyHandler);
    onSubmit(val);
  };
  const keyHandler = (e) => { if (e.key === 'Enter') handler(); };
  sendBtn.addEventListener('click', handler);
  textInput.addEventListener('keydown', keyHandler);
}
function hideTextInput(){
  inputbar.classList.add('hidden');
  errBox.textContent = '';
}

/* ====================== HELPERS ====================== */
function fieldIsDuplicate(fieldName){
  const f = fieldName.toLowerCase();
  return f.startsWith('full name') || f.includes('mobile');
}
function getActiveCategories(){
  const seen = [];
  SERVICES_DATA.forEach(s => {
    if (s.active && !seen.includes(s.category)) seen.push(s.category);
  });
  return seen;
}
function getServicesInCategory(cat){
  return SERVICES_DATA.filter(s => s.active && s.category === cat);
}
function genAppId(){
  const d = new Date();
  const pad = n => n.toString().padStart(2,'0');
  return 'AAR' + d.getFullYear().toString().slice(-2) + pad(d.getMonth()+1) + pad(d.getDate())
    + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

/* ====================== FLOW ====================== */
async function start(){
  await botSay("👋 Welcome / नमस्ते / नमस्कार", 400);
  await botSay("Please choose your preferred language / कृपया अपनी भाषा चुनें / कृपया तुमची भाषा निवडा", 500);
  addQuickReplies([
    {label:"🇬🇧 English", value:"en"},
    {label:"🇮🇳 हिंदी", value:"hi"},
    {label:"🇮🇳 मराठी", value:"mr"},
  ], (langCode) => {
    LANG = langCode;
    stepperEl.classList.remove('hidden');
    refreshStepperLabels();
    setStepper('info', []);
    askName();
  });
}

async function askName(){
  await botSay(T('welcome'));
  await botSay(T('askName'), 700);
  showTextInput(T('namePlaceholder'), v => v.length < 2 ? T('nameError') : null, v => {
    lead.name = v;
    askPhone();
  });
}

async function askPhone(){
  await botSay(T('thanksAskPhone', escapeHtml(lead.name)));
  showTextInput(T('phonePlaceholder'), v => /^[6-9]\d{9}$/.test(v) ? null : T('phoneError'), v => {
    lead.phone = v;
    askCategory();
  });
}

async function askCategory(){
  await botSay(T('askCategory'));
  const cats = getActiveCategories();
  addQuickReplies(cats.map(c => ({label:c})), (cat) => {
    lead.category = cat;
    askService();
  });
}

async function askService(){
  await botSay(T('askService', escapeHtml(lead.category)));
  const services = getServicesInCategory(lead.category);
  addQuickReplies(services.map(s => ({
    label: s.service,
    sub: T('priceLabel', s.price) + ' · ' + T('turnaroundLabel', s.turnaround),
    value: s.service
  })), (serviceName) => {
    const svc = services.find(s => s.service === serviceName);
    lead.service = svc.service;
    lead.price = svc.price;
    lead.turnaround = svc.turnaround || T('feeTBD');
    lead._fieldsToAsk = svc.fields.filter(f => !fieldIsDuplicate(f));
    lead._docsNote = svc.docs;
    lead.extraFields = {};
    askNextField(0);
  });
}

async function askNextField(idx){
  const fields = lead._fieldsToAsk || [];
  if (idx >= fields.length){
    showSummary();
    return;
  }
  const field = fields[idx];
  const label = translateField(field, LANG);
  await botSay(`${escapeHtml(label)}?`);
  showTextInput(`${label}…`, v => v.length < 1 ? T('fieldError') : null, v => {
    lead.extraFields[label] = v;
    askNextField(idx + 1);
  });
}

async function showSummary(){
  setStepper('confirm', ['info']);
  await botSay(T('summaryIntro'));
  const row = document.createElement('div');
  row.className = 'row bot';
  let extraRows = Object.entries(lead.extraFields).map(([k,v]) =>
    `<div class="row-item"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`
  ).join('');
  row.innerHTML = `
    <div class="summary-card" style="max-width:88%">
      <h4>${T('summaryTitle')}</h4>
      <div class="row-item"><span>${T('labelName')}</span><span>${escapeHtml(lead.name)}</span></div>
      <div class="row-item"><span>${T('labelPhone')}</span><span>${escapeHtml(lead.phone)}</span></div>
      <div class="row-item"><span>${T('labelService')}</span><span>${escapeHtml(lead.service)}</span></div>
      ${extraRows}
      <div class="row-item"><span>${T('labelFee')}</span><span>${lead.price ? '₹'+lead.price : T('feeTBD')}</span></div>
      <div class="row-item"><span>${T('labelTurnaround')}</span><span>${escapeHtml(lead.turnaround)}</span></div>
    </div>`;
  chat.appendChild(row);
  scrollDown();
  addQuickReplies([
    {label:T('confirmBtn'), primary:true, value:"confirm"},
    {label:T('startOverBtn')}
  ], (choice) => {
    if (choice === 'confirm') goToPayment();
    else location.reload();
  });
}

async function goToPayment(){
  setStepper('payment', ['info','confirm']);
  await botSay(T('paymentIntro'));
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `
    <div class="pay-card" style="max-width:88%">
      <h4>${T('payCardTitle')}</h4>
      <div class="fee">${lead.price ? '₹'+lead.price : T('feeTBD')}</div>
      <div>${T('payForService', escapeHtml(lead.service))}</div>
      <span class="tag">${T('payTag')}</span>
      <div style="margin-top:8px;color:#5F7168;">${T('payNote', !!lead.price)}</div>
    </div>`;
  chat.appendChild(row);
  scrollDown();
  addQuickReplies([
    {label:T('continuePayLater'), primary:true, value:"pending"}
  ], () => {
    lead.paymentStatus = "Pending (Pay Later — online payment coming soon)";
    askDocsChoice();
  });
}

async function askDocsChoice(){
  setStepper('docs', ['info','confirm','payment']);
  await botSay(T('docsIntro', escapeHtml(lead._docsNote || '')));
  await botSay(T('docsWhen'), 600);
  addQuickReplies([
    {label:T('docsNow'), value:"now"},
    {label:T('docsLater'), sub:T('docsLaterSub'), value:"later"}
  ], (choice) => {
    lead.docsChoice = choice;
    if (choice === 'now') showFileUpload();
    else finalize();
  });
}

function showFileUpload(){
  const row = document.createElement('div');
  row.className = 'row bot';
  const wrap = document.createElement('div');
  wrap.className = 'file-row';
  wrap.style.maxWidth = '88%';
  wrap.innerHTML = `
    <div>${T('fileChooseLabel', MAX_FILES, MAX_FILE_MB)}</div>
    <input type="file" id="fileInput" multiple accept="image/*,application/pdf">
    <div class="file-list" id="fileList"></div>
    <button class="qr-btn primary" id="uploadBtn">${T('uploadSubmitBtn')}</button>
    <button class="qr-btn" id="skipUploadBtn">${T('skipUploadBtn')}</button>
  `;
  row.appendChild(wrap);
  chat.appendChild(row);
  scrollDown();

  const fileInput = wrap.querySelector('#fileInput');
  const fileList = wrap.querySelector('#fileList');
  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files).slice(0, MAX_FILES);
    fileList.textContent = files.map(f => `${f.name} (${(f.size/1024/1024).toFixed(1)}MB)`).join(', ');
  });

  wrap.querySelector('#uploadBtn').onclick = async () => {
    const files = Array.from(fileInput.files).slice(0, MAX_FILES);
    const oversized = files.find(f => f.size > MAX_FILE_MB * 1024 * 1024);
    if (oversized){ fileList.innerHTML = `<span style="color:#C0503A">${T('fileTooBig', oversized.name, MAX_FILE_MB)}</span>`; return; }
    wrap.querySelectorAll('button').forEach(b => b.disabled = true);
    addBubble(files.length ? T('filesAttached', files.length) : T('noFilesAttached'), 'user');
    if (files.length){
      await botSay(T('uploading'), 400);
      try{
        lead.files = await Promise.all(files.map(fileToBase64));
      }catch(err){
        lead.files = [];
      }
    }
    finalize();
  };
  wrap.querySelector('#skipUploadBtn').onclick = () => {
    wrap.querySelectorAll('button').forEach(b => b.disabled = true);
    addBubble(T('docsLater'), 'user');
    lead.docsChoice = 'later';
    finalize();
  };
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve({ name: file.name, mimeType: file.type || 'application/octet-stream', data: base64 });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function finalize(){
  await botTyping(700);
  const appId = genAppId();
  const fieldsProvided = Object.entries(lead.extraFields).map(([k,v]) => `${k}: ${v}`).join('; ');
  const payload = {
    leadId: appId,
    name: lead.name,
    phone: lead.phone,
    category: lead.category,
    service: lead.service,
    price: lead.price,
    fieldsProvided: fieldsProvided,
    paymentStatus: lead.paymentStatus,
    language: LANG,
    files: lead.docsChoice === 'now' ? lead.files : []
  };
  try{
    if (SHEET_ENDPOINT && !SHEET_ENDPOINT.includes("PASTE_YOUR")){
      await fetch(SHEET_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
    }
    addBubble(`${T('finalTitle', escapeHtml(lead.name))}<br>${T('finalBody', appId)}`, 'bot');
  }catch(err){
    addBubble(T('submitError'), 'bot');
  }
  hideTextInput();
  addQuickReplies([
    {label:T('exploreBtn'), primary:true, value:"explore"}
  ], () => {
    resetForNextService();
  });
}

function resetForNextService(){
  lead.category = ""; lead.service = ""; lead.price = null; lead.turnaround = "";
  lead.extraFields = {}; lead.paymentStatus = ""; lead.docsChoice = ""; lead.files = [];
  setStepper('info', []);
  askCategory();
}

start();
</script>
</body>
</html>
