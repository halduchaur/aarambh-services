<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Aarambh support team workspace with laptop, chat and plant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4F1E2"/>
      <stop offset="1" stop-color="#F7FAF3"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D9B6"/>
      <stop offset="1" stop-color="#D9C59C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFF4CF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4CF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="640" height="480" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="480" fill="url(#bg)"/>
    <circle cx="140" cy="110" r="190" fill="url(#glow)"/>

    <!-- soft window panes -->
    <rect x="360" y="40" width="210" height="190" rx="10" fill="#FFFFFF" opacity="0.35"/>
    <line x1="465" y1="40" x2="465" y2="230" stroke="#CFE4D2" stroke-width="3" opacity="0.7"/>
    <line x1="360" y1="135" x2="570" y2="135" stroke="#CFE4D2" stroke-width="3" opacity="0.7"/>

    <!-- desk -->
    <rect x="0" y="360" width="640" height="120" fill="url(#desk)"/>
    <rect x="0" y="358" width="640" height="4" fill="#CDB98F"/>

    <!-- plant (left) -->
    <ellipse cx="100" cy="366" rx="52" ry="8" fill="#000" opacity="0.10"/>
    <path d="M100 330 C 98 300, 96 270, 100 235" stroke="#2F6B49" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M100 300 C 62 292, 48 258, 58 226 C 92 236, 104 268, 100 300 Z" fill="#3F8A5B"/>
    <path d="M100 280 C 138 272, 152 238, 142 206 C 108 216, 96 248, 100 280 Z" fill="#4FA06B"/>
    <path d="M100 252 C 78 240, 76 210, 94 188 C 114 206, 114 234, 100 252 Z" fill="#2F7A4D"/>
    <path d="M62 330 h76 l-9 38 h-58 z" fill="#C9763A"/>
    <rect x="58" y="324" width="84" height="12" rx="4" fill="#D98A4C"/>

    <!-- laptop -->
    <ellipse cx="320" cy="376" rx="210" ry="10" fill="#000" opacity="0.12"/>
    <rect x="170" y="168" width="300" height="192" rx="12" fill="#25352F"/>
    <rect x="182" y="180" width="276" height="168" rx="5" fill="#F4F9F2"/>
    <!-- screen header -->
    <path d="M182 185 a5 5 0 0 1 5 -5 h266 a5 5 0 0 1 5 5 v22 h-276 z" fill="#144130"/>
    <circle cx="200" cy="194" r="8" fill="#CE8F2E"/>
    <rect x="214" y="188" width="74" height="6" rx="3" fill="#E6F3E1"/>
    <rect x="214" y="197" width="46" height="4" rx="2" fill="#9FC4B0"/>
    <circle cx="438" cy="194" r="4" fill="#6FD08C"/>
    <!-- chat bubbles -->
    <rect x="196" y="220" width="132" height="30" rx="11" fill="#FFFFFF" stroke="#CFE4D2"/>
    <rect x="208" y="230" width="86" height="5" rx="2.5" fill="#B7CCC0"/>
    <rect x="208" y="239" width="56" height="5" rx="2.5" fill="#D4E2DA"/>
    <rect x="304" y="258" width="138" height="30" rx="11" fill="#DCF2D0"/>
    <rect x="316" y="268" width="94" height="5" rx="2.5" fill="#7FB594"/>
    <rect x="316" y="277" width="62" height="5" rx="2.5" fill="#A5CDB3"/>
    <rect x="196" y="296" width="112" height="30" rx="11" fill="#FFFFFF" stroke="#CFE4D2"/>
    <rect x="208" y="306" width="72" height="5" rx="2.5" fill="#B7CCC0"/>
    <rect x="208" y="315" width="44" height="5" rx="2.5" fill="#D4E2DA"/>
    <!-- check badge on screen -->
    <circle cx="428" cy="322" r="14" fill="#2F6B49"/>
    <path d="M421 322 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- base -->
    <rect x="140" y="358" width="360" height="16" rx="8" fill="#C9D2CD"/>
    <rect x="286" y="358" width="68" height="6" rx="3" fill="#AEB9B3"/>

    <!-- mug with logo (right) -->
    <ellipse cx="548" cy="370" rx="44" ry="7" fill="#000" opacity="0.12"/>
    <path d="M590 312 c26 0 26 36 0 36" stroke="#144130" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="514" y="294" width="76" height="76" rx="10" fill="#144130"/>
    <rect x="514" y="294" width="76" height="12" rx="6" fill="#1B5440"/>
    <path d="M552 316 l-17 40 h10 l7 -17 l7 17 h10 z" fill="#CE8F2E"/>
    <path d="M547 342 h10" stroke="#144130" stroke-width="3"/>

    <!-- floating badges -->
    <g>
      <circle cx="556" cy="226" r="30" fill="#FFFFFF"/>
      <circle cx="556" cy="226" r="30" fill="none" stroke="#CFE4D2" stroke-width="2"/>
      <path d="M556 210 l-14 5 v11 c0 10 6 17 14 21 c8 -4 14 -11 14 -21 v-11 z" fill="none" stroke="#2F6B49" stroke-width="3" stroke-linejoin="round"/>
      <path d="M549 227 l5 5 l9 -10" stroke="#2F6B49" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="176" cy="132" r="26" fill="#FFFFFF"/>
      <circle cx="176" cy="132" r="26" fill="none" stroke="#CFE4D2" stroke-width="2"/>
      <path d="M163 124 h26 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-14 l-8 7 v-7 h-4 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="#E6F3E1" stroke="#144130" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="170" cy="134" r="2" fill="#144130"/><circle cx="177" cy="134" r="2" fill="#144130"/><circle cx="184" cy="134" r="2" fill="#144130"/>
    </g>
  </g>
</svg>
